name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/ARCHITECTURE.md
          test -s docs/ROADMAP.md
          test -s docs/TESTING.md
          test -s docs/CS_LAUNCHER_PLUS_COMPAT.md
          test -s config/minecraft-1.12.2.json
          test -s scripts/validate_profile.py
          test -s scripts/package_cslauncher_runtime.py
          test -s tests/test_profile.py
          test -s tests/test_cslauncher_package.py

      - name: Validate JSON syntax
        run: python -m json.tool config/minecraft-1.12.2.json > /dev/null

      - name: Validate profile rules
        run: python scripts/validate_profile.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
