name: OpenJDK 8 ARM64 source preflight

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/openjdk8-arm64-preflight.yml"
      - "docs/BUILD_STATUS.md"
      - "docs/BASE_SELECTION.md"
      - "docs/OPENJDK8_ANDROID_PATCH_REVIEW.md"
      - "docs/OPENJDK8_ARM64_BUILD.md"
      - "scripts/audit_openjdk8_recipe.py"
      - "tests/test_openjdk8_recipe_audit.py"

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout Mikael Runtime 8
        uses: actions/checkout@v4

      - name: Install source validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git ca-certificates

      - name: Fetch pinned Android build recipe
        shell: bash
        run: |
          set -euo pipefail
          git init upstream-recipe
          git -C upstream-recipe remote add origin https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch.git
          git -C upstream-recipe fetch --depth 1 origin 04b90441da7e9649cb6508a037423f08d1fc531f
          git -C upstream-recipe checkout --detach FETCH_HEAD
          test "$(git -C upstream-recipe rev-parse HEAD)" = "04b90441da7e9649cb6508a037423f08d1fc531f"

      - name: Audit pinned upstream recipe without executing it
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_openjdk8_recipe.py --repo upstream-recipe --output openjdk8-upstream-audit.txt
          cat openjdk8-upstream-audit.txt

      - name: Fetch pinned OpenJDK 8u source
        shell: bash
        run: |
          set -euo pipefail
          git init openjdk
          git -C openjdk remote add origin https://github.com/openjdk/jdk8u.git
          git -C openjdk fetch --depth 1 origin 7fdf5cd77f209427758437d7e147ea1c18b4ec35
          git -C openjdk checkout --detach FETCH_HEAD
          test "$(git -C openjdk rev-parse HEAD)" = "7fdf5cd77f209427758437d7e147ea1c18b4ec35"
          test -f openjdk/configure

      - name: Verify patch identities and apply in dependency order
        shell: bash
        run: |
          set -euo pipefail
          cd openjdk
          test -z "$(git status --porcelain)"
          # GitHub's blob SHA for the pinned patch files is checked before use.
          test "$(git hash-object ../upstream-recipe/patches/jdk8u_android.diff)" = "801ec26807256e5206616c2da14c80676519bce9"
          test "$(git hash-object ../upstream-recipe/patches/jdk8u_android_main.diff)" = "8ba2f3c46963b3d125eb416cfb5185a4f53b69f6"
          # Apply and validate sequentially: the second patch is checked against
          # the tree after the first patch, not against the pristine source.
          git apply --check --whitespace=fix ../upstream-recipe/patches/jdk8u_android.diff
          git apply --whitespace=fix ../upstream-recipe/patches/jdk8u_android.diff
          git diff --check
          git apply --check --whitespace=fix ../upstream-recipe/patches/jdk8u_android_main.diff
          git apply --whitespace=fix ../upstream-recipe/patches/jdk8u_android_main.diff
          git diff --check
          test -d hotspot/src/cpu/aarch64
          git diff --stat | tee ../android-patch-diff-stat.txt
          git diff --name-only | sort -u | tee ../android-patch-files.txt
          echo "Pinned Android patches applied sequentially with exact blob identities."
      - name: Record source provenance
        if: always()
        shell: bash
        run: |
          {
            echo "Recipe commit: 04b90441da7e9649cb6508a037423f08d1fc531f"
            if test -f openjdk8-upstream-audit.txt; then
              echo "### Upstream recipe audit"
              cat openjdk8-upstream-audit.txt
            fi
            echo "OpenJDK commit: 7fdf5cd77f209427758437d7e147ea1c18b4ec35"
            if test -d openjdk/.git; then
              echo "OpenJDK HEAD: $(git -C openjdk rev-parse HEAD)"
              echo "Patch status:"
              git -C openjdk status --short
            fi
            for file in android-patch-diff-stat.txt android-patch-files.txt; do
              if test -f "$file"; then echo "### $file"; cat "$file"; fi
            done
          } | tee openjdk-source-preflight.txt

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MikaelRuntime8-OpenJDK8-ARM64-Preflight
          path: |
            openjdk-source-preflight.txt
            android-patch-diff-stat.txt
            android-patch-files.txt
            openjdk8-upstream-audit.txt
          if-no-files-found: warn
          retention-days: 14
